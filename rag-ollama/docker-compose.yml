services:
  rag-api:
    build: .
    container_name: rag-api
    volumes:
      - ./app:/app
      - ./vectorstore:/vectorstore
      - ./app/data/docs:/app/data/docs
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
